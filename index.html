    <!-- JavaScript -->
    <script>

        const videoUrl = 'Diwali.mp4';

        const enterButton = document.getElementById('enter-button');
        const welcomeOverlay = document.getElementById('welcome-overlay');
        const mainContent = document.getElementById('main-content');
        const diwaliVideo = document.getElementById('diwali-video');
        const diwaliAudio = document.getElementById('diwali-audio');

        // Welcome Screen
        enterButton.addEventListener('click', () => {

            welcomeOverlay.style.display = 'none';
            mainContent.style.display = 'block';

            diwaliVideo.src = videoUrl;

            diwaliVideo.play().catch(() => {
                diwaliVideo.muted = true;
                diwaliVideo.play();
            });

            diwaliAudio.play().catch(e => {
                console.log("Audio autoplay failed:", e);
            });

        });

        // Show Sender Name
        window.onload = function() {

            const urlParams = new URLSearchParams(window.location.search);
            const senderName = urlParams.get('name');

            const greetingElement = document.getElementById('greetingMessage');

            if (senderName) {

                const nameSpan = document.createElement('span');
                nameSpan.textContent = senderName;

                greetingElement.appendChild(nameSpan);
                greetingElement.append(' की ओर से');

                greetingElement.appendChild(document.createElement('br'));

                greetingElement.append(
                    'आपको और आपके परिवार को दिवाली की हार्दिक शुभकामनाएँ 🎇'
                );

            } else {

                greetingElement.textContent =
                    'आपको और आपके परिवार को दिवाली की हार्दिक शुभकामनाएँ!';

            }

            animateFireworks();

        };

        // DIRECT LINK GENERATOR - NO SUBSCRIPTION TASK
        function generateLink() {

            const name = document.getElementById('nameInput').value.trim();

            if (!name) {
                alert("कृपया पहले अपना नाम दर्ज करें!");
                return;
            }

            const baseUrl = window.location.href.split('?')[0];

            const newLink =
                `${baseUrl}?name=${encodeURIComponent(name)}`;

            document.getElementById('generatedLink').value = newLink;

            document.getElementById('linkContainer').style.display = 'block';

            document.getElementById('shareBtn').style.display = 'inline-flex';

            document.getElementById('generateBtn').style.display = 'none';

        }

        // WhatsApp Sharing
        async function shareLink() {

            const link = document.getElementById('generatedLink').value;

            const name =
                document.getElementById('nameInput').value.trim() || "किसी अपने ने";

            const shareData = {

                title: '🎁 दिवाली की शुभकामनाएँ!',

                text: `${name} ने आपको दिवाली की शुभकामनाएँ भेजी हैं:`,

                url: link

            };

            if (navigator.share) {

                try {

                    await navigator.share(shareData);

                } catch (err) {

                    console.log("Share cancelled");

                }

            } else {

                try {

                    await navigator.clipboard.writeText(link);

                    alert("लिंक कॉपी हो गया! अब आप इसे व्हाट्सएप पर शेयर कर सकते हैं।");

                } catch (err) {

                    alert("लिंक कॉपी नहीं हो पाया। कृपया लिंक को मैन्युअली कॉपी करें।");

                }

            }

        }

        // Fireworks Animation
        function animateFireworks() {

            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let fireworks = [];
            let particles = [];

            const gravity = 0.05;

            class Firework {

                constructor() {

                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;

                    this.targetY = Math.random() * (canvas.height / 2);

                    this.color =
                        `hsl(${Math.random() * 360}, 100%, 50%)`;

                    this.speed = 2 + Math.random() * 3;

                }

                update() {

                    this.y -= this.speed;

                    return this.y < this.targetY;

                }

                draw() {

                    ctx.fillStyle = this.color;

                    ctx.beginPath();

                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);

                    ctx.fill();

                }

                explode() {

                    for (let i = 0; i < 100; i++) {

                        particles.push(
                            new Particle(this.x, this.y, this.color)
                        );

                    }

                }

            }

            class Particle {

                constructor(x, y, color) {

                    this.x = x;
                    this.y = y;
                    this.color = color;

                    this.size = Math.random() * 2 + 1;
                    this.alpha = 1;

                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 8 + 1;

                    this.friction = 0.96;

                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;

                }

                update() {

                    this.vx *= this.friction;
                    this.vy *= this.friction;

                    this.vy += gravity;

                    this.x += this.vx;
                    this.y += this.vy;

                    this.alpha -= 0.02;

                    return this.alpha > 0;

                }

                draw() {

                    ctx.save();

                    ctx.globalAlpha = this.alpha;

                    ctx.beginPath();

                    ctx.arc(
                        this.x,
                        this.y,
                        this.size,
                        0,
                        Math.PI * 2,
                        false
                    );

                    ctx.fillStyle = this.color;

                    ctx.fill();

                    ctx.restore();

                }

            }

            function animate() {

                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';

                ctx.fillRect(0, 0, canvas.width, canvas.height);

                fireworks.forEach((fw, i) => {

                    if (fw.update()) {

                        fw.explode();

                        fireworks.splice(i, 1);

                    } else {

                        fw.draw();

                    }

                });

                particles.forEach((p, i) => {

                    if (!p.update()) {

                        particles.splice(i, 1);

                    } else {

                        p.draw();

                    }

                });

                requestAnimationFrame(animate);

            }

            setInterval(() => {

                if (fireworks.length < 20) {

                    fireworks.push(new Firework());

                }

            }, 200);

            window.addEventListener('resize', () => {

                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

            });

            animate();

        }

    </script>
